# Workspace for the WebAssembly plugins (plugin API 2) and the SDK they share.
# Each plugin builds to a .wasm module:
#
#   rustup target add wasm32-unknown-unknown
#   cargo build --release --target wasm32-unknown-unknown
#
# The modules land in target/wasm32-unknown-unknown/release/<id>.wasm and are
# copied into plugins/<id>/plugin.wasm by build-index.
[workspace]
resolver = "2"
members = [
    "sdk",
    "admin-tools",
    "azure",
    "azure-devops",
    "fabric",
    "file-changes",
    "networks",
    "office-paths",
    "outlook",
    "outlook-calendar",
    "remote-desktop",
    "remote-workspaces",
    "teams-meetings",
    "terminal-ssh",
    "ticket-ids",
    "vscode-git",
    "web-addresses",
]

[profile.release]
opt-level = "s"
lto = true
strip = true
