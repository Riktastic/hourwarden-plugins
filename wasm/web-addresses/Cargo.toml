[package]
name = "web-addresses"
version = "0.6.0"
edition = "2021"
description = "Web domains and Microsoft IDs from the browser's address bar, as a HourWarden WebAssembly plugin"

[lib]
name = "web_addresses"
crate-type = ["cdylib"]

[dependencies]
hourwarden-plugin = { path = "../sdk" }
serde_json = "1"
regex-lite = "0.1"
