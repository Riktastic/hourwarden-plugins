id = "remote-workspaces"
name = "Citrix, Azure Virtual Desktop and Horizon"
version = "0.3.0"
author = "HourWarden"
category = "Remote access"
docs = "README.md"
description = "Recognises the remote desktop or app you work in through Citrix Workspace, Azure Virtual Desktop and Windows 365 (Windows App, Remote Desktop client) and VMware Horizon. The workplace name is matched against customer names and aliases."
api = 2
capabilities = []
platforms = ["windows", "linux"]
permissions = [
    "Reads the title of the remote workplace window in front",
]

[run]
module = "plugin.wasm"

[[settings]]
key = "poll_seconds"
label = "Check every"
type = "number"
description = "How often the window title is checked, in seconds."
default = 2
min = 1
max = 30
