id = "outlook"
name = "Outlook mail"
version = "0.2.1"
author = "Timekeeper"
category = "Mail"
description = "Reads the subject and the sender and recipient domains of the mail or appointment you have open or selected in Outlook (classic), so mail time goes to the customer with that mail domain. Also counts the mails you send to and receive from each customer."
api = 1
platforms = ["windows"]
permissions = [
    "Reads the subject, sender and recipients of the selected or open Outlook item (read only, never the body)",
    "Reads the date, sender and recipients of mail in Sent Items and the Inbox, to count mail per customer",
    "Talks to Outlook through its automation interface (COM)",
    "Runs a PowerShell script",
]

[run]
command = "powershell"
args = ["-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "outlook.ps1"]

[[settings]]
key = "poll_seconds"
label = "Check every"
type = "number"
description = "How often the selected item is checked while Outlook is in front, in seconds."
default = 3
min = 1
max = 30

[[settings]]
key = "max_recipients"
label = "Recipients to read"
type = "number"
description = "Mails to more people than this only use the first ones, to keep Outlook fast."
default = 30
min = 1
max = 500

[[settings]]
key = "count_mails"
label = "Count mails per customer"
type = "bool"
description = "Count the mails in Sent Items and the Inbox per customer mail domain. Turn off if Outlook asks whether a program may read e-mail addresses."
default = true

[[settings]]
key = "count_every_minutes"
label = "Count new mails every"
type = "number"
description = "How often Sent Items and the Inbox are checked for new mail, in minutes."
default = 5
min = 1
max = 60

[[settings]]
key = "count_days"
label = "Count mails from the last"
type = "number"
description = "How many days back mails are counted when the plugin starts. Mails already counted are not counted twice."
default = 7
min = 1
max = 90

[[settings]]
key = "ignore_domains"
label = "Ignore these domains"
type = "list"
description = "Your own company's mail domains, which appear in every mail and say nothing about the customer."
default = []
