id = "terminal-ssh"
name = "SSH sessions in terminals"
version = "0.1.1"
author = "Timekeeper"
category = "Remote access"
docs = "README.md"
description = "Recognises the server of an SSH session from the title of Windows Terminal, PuTTY, KiTTY, SecureCRT, MobaXterm and other terminals, so time on a customer's server goes to that customer, like a remote desktop session."
api = 1
platforms = ["windows"]
permissions = [
    "Reads the title of terminal windows in front",
    "Runs a PowerShell script",
]

[run]
command = "powershell"
args = ["-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "terminal-ssh.ps1"]

[[settings]]
key = "apps"
label = "Terminals"
type = "list"
description = "Programs whose window titles are read."
default = ["windowsterminal.exe", "openconsole.exe", "conhost.exe", "putty.exe", "kitty.exe", "mobaxterm.exe", "mremoteng.exe", "securecrt.exe", "tabby.exe", "termius.exe", "wezterm-gui.exe", "alacritty.exe", "royalts.exe"]

[[settings]]
key = "local_hosts"
label = "Your own machines"
type = "list"
description = "Names of your own computers and WSL distributions, whose prompts are not remote servers. This computer is always left out."
default = []

[[settings]]
key = "poll_seconds"
label = "Check every"
type = "number"
description = "How often the window title is checked, in seconds."
default = 2
min = 1
max = 30
