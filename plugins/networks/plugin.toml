id = "networks"
name = "Wi-Fi and VPN networks"
version = "0.3.0"
author = "HourWarden"
category = "Location"
docs = "README.md"
description = "Reports the Wi-Fi network or VPN you are connected to. Link a customer's office Wi-Fi or VPN to that customer; it is used only when nothing else decides the customer."
api = 2
capabilities = ["net.connections"]
platforms = ["windows", "linux"]
permissions = [
    "Reads the names of connected networks and VPN connections",
]

[run]
module = "plugin.wasm"

[[settings]]
key = "poll_seconds"
label = "Check every"
type = "number"
description = "How often the connected network is checked, in seconds."
default = 30
min = 5
max = 600

[[settings]]
key = "prefer_vpn"
label = "Prefer the VPN"
type = "bool"
description = "When a Windows VPN or a company VPN client (AnyConnect, GlobalProtect, FortiClient and similar) is connected, report the VPN instead of the Wi-Fi network."
default = true

[[settings]]
key = "ignore_networks"
label = "Ignore these networks"
type = "list"
description = "Network or VPN names that are never reported, such as your own VPN."
default = []
