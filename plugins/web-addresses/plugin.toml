id = "web-addresses"
name = "Web addresses in the browser"
version = "0.1.0"
author = "Timekeeper"
category = "Browser"
description = "Reads the domain of the page in front in Edge, Chrome, Brave and other Chromium browsers, such as portal.contoso.com. It counts like a mail domain: add a customer's web domains (contoso.com, contoso.sharepoint.com) under mail domains on the customer page. Useful when you use one browser profile for several customers."
api = 1
platforms = ["windows"]
permissions = [
    "Reads the address bar of the browser window in front (only the domain is used)",
    "Uses Windows UI Automation",
    "Runs a PowerShell script",
]

[run]
command = "powershell"
args = ["-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "web-addresses.ps1"]

[[settings]]
key = "browsers"
label = "Browsers"
type = "list"
description = "Programs whose address bar is read."
default = ["msedge.exe", "chrome.exe", "brave.exe", "vivaldi.exe", "opera.exe", "arc.exe"]

[[settings]]
key = "ignore_domains"
label = "Ignore these domains"
type = "list"
description = "Domains (and their subdomains) that are never reported, such as your own company's intranet."
default = []

[[settings]]
key = "poll_seconds"
label = "Check every"
type = "number"
description = "How often the address bar is read, in seconds."
default = 3
min = 1
max = 30
