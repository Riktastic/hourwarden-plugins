id = "web-addresses"
name = "Web addresses in the browser"
version = "0.6.0"
author = "HourWarden"
category = "Browser"
docs = "README.md"
description = "Reads the domain of the page in front in Edge, Chrome, Brave and other Chromium browsers, such as portal.contoso.com. It counts like a mail domain: add a customer's web domains (contoso.com, contoso.sharepoint.com) on the customer page. Azure portal, Entra, Power BI and Fabric addresses also give the customer's Microsoft tenant (contoso.onmicrosoft.com or its tenant ID), Azure subscription IDs and Power BI or Fabric workspace IDs; add these to the customer page too. Each ID is listed in this plugin's log the first time it is seen. SharePoint admin and OneDrive addresses count as the customer's SharePoint. Useful when you use one browser profile for several customers."
api = 2
capabilities = ["browser.address"]
platforms = ["windows"]
permissions = [
    "Reads the address bar of the browser window in front (only the domain and Microsoft tenant, subscription and workspace IDs are used)",
    "Uses Windows UI Automation",
]

[run]
module = "plugin.wasm"

[[settings]]
key = "browsers"
label = "Browsers"
type = "list"
description = "Programs whose address bar is read."
default = ["msedge.exe", "chrome.exe", "firefox.exe", "brave.exe", "vivaldi.exe", "opera.exe", "arc.exe"]

[[settings]]
key = "ignore_domains"
label = "Ignore these domains"
type = "list"
description = "Domains (and their subdomains) that are never reported, such as your own company's intranet."
default = []

[[settings]]
key = "poll_seconds"
label = "Check every"
type = "number"
description = "How often the address bar is read, in seconds."
default = 3
min = 1
max = 30
