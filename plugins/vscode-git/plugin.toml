id = "vscode-git"
name = "VS Code folders and git repositories"
version = "0.1.0"
author = "Timekeeper"
category = "Development"
description = "Finds the folder of the VS Code (or Cursor, Windsurf, VSCodium) window in front and the git repository it belongs to, such as contoso/portal. The folder counts as a customer folder; the repository's owner and name are matched against customer names and aliases. Remote SSH windows give their server."
api = 1
platforms = ["windows"]
permissions = [
    "Reads the title of VS Code windows in front",
    "Reads VS Code's list of recent workspace folders and the .git/config of the open folder",
    "Runs a PowerShell script",
]

[run]
command = "powershell"
args = ["-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "vscode-git.ps1"]

[[settings]]
key = "poll_seconds"
label = "Check every"
type = "number"
description = "How often the window in front is checked, in seconds."
default = 3
min = 1
max = 30
